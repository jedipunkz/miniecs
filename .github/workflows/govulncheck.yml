name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday. New advisories appear without any change in this repo.
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Reports only vulnerabilities reachable from this module's call graph.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
