name: Release CLI to the GitHub Release
on:
  workflow_dispatch:
    inputs:
      method:
        description: |
          Which number to increment in the semantic versioning.
          Set 'major', 'minor' or 'patch'.
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only this job may push tags/releases and mint OIDC tokens for
    # build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # git-vertag-action pushes the new tag with the persisted
      # credentials. No later step uploads artifacts from the workspace.
      - name: Checkout Sources
        uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Bump-up Semantic Version
        uses: kyoh86/git-vertag-action@v1.1
        with:
          # method: "major", "minor" or "patch" to update tag with semver
          method: "${{ github.event.inputs.method }}"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          # Never restore a cache into the release build.
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config .goreleaser.yml

      # Verify a downloaded archive with:
      #   gh attestation verify <archive> --repo jedipunkz/miniecs
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
